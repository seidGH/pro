name: Frontend CI

on:
  push:
    paths:
      - 'front/**'
  pull_request:
    paths:
      - 'front/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # Define the backend as a service available to this job
    services:
      api:
        image: my-backend-image:latest # Ensure this image is accessible
        ports:
          - 5000:5000
    
    defaults:
      run:
        working-directory: ./front

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci # Use ci for faster, consistent installs in CI

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build

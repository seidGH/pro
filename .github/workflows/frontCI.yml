name: Frontend CI
on:
  push:
    paths: ['front/**']
  pull_request:
    paths: ['front/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front         #these paths i desicde my self like ./folder or any thing 
                                           # it is my power to decide on this not on the actions/checkout lol
    steps:
      - uses: actions/checkout@v4  #the runner desices where to put the checkout codes , usually /home/runner/work/..

      - name: Setup Node.js
      - uses: actions/setup-node@v4
        with: 
          node-version: '20' 
          cache: 'npm'
          cashe-dependency-path: './front/package-lock.json'                              #.@the working space of the github action or runner.
      - name: Install & Build
        run: |
          npm install
          npm run build

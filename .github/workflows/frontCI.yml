name: Frontend CI
on:
  push:
    paths: ['front/**']
  pull_request:
    paths: ['front/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Corrected the typo below:
          cache-dependency-path: './front/package-lock.json'

      - name: Install & Build
        run: |
          npm install
          npm run build

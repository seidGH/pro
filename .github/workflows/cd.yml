name: Monorepo CD Pipeline

on:
  workflow_run:
    workflows: ["Monorepo CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  # 1. DETECT CHANGES
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:  
      front: ${{ steps.filter.outputs.front }}
      back: ${{ steps.filter.outputs.back }}
    steps:
      # --- ADDED: Checkout is mandatory for paths-filter to work ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.workflow_run.base_branch || 'main' }}
          filters: |
            front: 
              - 'front/**'
              - 'scripts/deploy.sh'
            back: 
              - 'back/**'
              - 'scripts/deploy.sh'

  # 2. DEPLOY FRONTEND
  deploy-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.front == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          workdir: /home/seid/pro
          script: ./deploy.sh front

  # 3. DEPLOY BACKEND
  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.back == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          workdir: /home/seid/pro
          script: ./deploy.sh back

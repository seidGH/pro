name: Monorepo CD Pipeline

on:
  workflow_run:
    workflows: ["Monorepo CI Pipeline"] # Trigger after CI finishes
    types: [completed]
    branches: [main]

jobs:
  # 1. DETECT CHANGES (To avoid building what hasn't changed)
  changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:  
      frontend: ${{ steps.filter.outputs.frontend }}   #the same code change that was detected on the ci will be used to
# chose front or back end deployment process, only one of them will be selected , not both front or back 
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend: 
              - 'frontend/**'
              - 'scripts/deploy.sh'
            backend: 
              - 'backend/**'
              - 'scripts/deploy.sh'

  # 2. DEPLOY FRONTEND
  deploy-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /frontend
            git pull origin main
            ./deploy_frontend.sh # Your specific bash script

  # 3. DEPLOY BACKEND
  deploy-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            ./deploy.sh

name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH into EC2 and run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
            script: |
              set -e # Exit immediately if a command fails
  
  # Ensure target directory exists
              mkdir -p /home/ubuntu/pro/front
              cd /home/ubuntu/pro/front

  # Initialize if not already a repo
              if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:seidGH/pro.git
              fi

  # Use local config instead of global
              git config core.sshCommand "ssh -o StrictHostKeyChecking=accept-new"
  
  # Fetch and force update
              git fetch origin main
              git reset --hard origin/main

  # Execute orchestrator
              chmod +x orchestrator.sh
              ./orchestrator.sh front

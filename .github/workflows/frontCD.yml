name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH into EC2 and run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/ubuntu/pro/front
            cd /home/ubuntu/pro/front
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:seidGH/pro.git
              git fetch origin
              git reset --hard origin/main
            else
              git fetch origin
              git reset --hard origin/main
            fi
            chmod +x deploy.sh
            ./deploy.sh

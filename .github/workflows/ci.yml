name: Monorepo CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. THE DETECTOR (The question provider)
  changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      front: ${{ steps.filter.outputs.front }}
      back: ${{ steps.filter.outputs.back }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 #the detection will not stop checkout because copying the whole project file from the github main storage do not take 2-5 seconds ,
# it is almost not pain pont for our pipline`s execution  speed.
        
      - name: Check for file changes
        id: filter

base: 'main'        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'front/**'
            back:
              - 'back/**'

  # 2. THE FRONTEND JOB (The conditional listener)
  frontend-ci:
    name: Frontend CI
    needs: changes                       # <-- CRITICAL: Wait for the detector job to finish
    if: ${{ needs.changes.outputs.front == 'true' }} # <-- THE CONDITIONAL CHECKING!
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front   #Runner lives in the project`s root directory /pro ,
# so we have to specify by our ci.yml line here telling the runner to go one step forwared inside the front end folder and work the below tasks and make your default work station here .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install & Test
        run: |
          npm ci
          npm run test

  # 3. THE BACKEND JOB (The conditional listener)
  backend-ci:
    name: Backend CI
    needs: changes                       # <-- CRITICAL: Wait for the detector job to finish
    if: ${{ needs.changes.outputs.back == 'true' }}  # <-- THE CONDITIONAL CHECKING!
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install & Test
        run: |
          npm ci
          npm run test

kname: CI Pipeline

on: [push]

defaults:
  run:
    working-directory: ./back

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15 # Replace with your specific DB image (e.g., mysql:8)
        env:
          POSTGRES_DB: inventory
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password # Set a dummy password for tests
        ports:
          # Map container port 5432 to host port 5436
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: npm install

      - name: Run Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5436
          DB_USER: admin
          DB_PASS: password # Match the password defined in the service env
          DB_NAME: inventory
        run: npm test
